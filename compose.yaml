services:
  database:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: cv_hub
      MYSQL_ROOT_PASSWORD: "12345678"
    ports:
      - "3306:3306"
    volumes:
      - database_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p12345678"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/var/www/html
    environment:
      APP_ENV: dev
      DATABASE_URL: mysql://root:12345678@database:3306/cv_hub?serverVersion=8.4.3&charset=utf8mb4
    depends_on:
      database:
        condition: service_healthy

volumes:
  database_data:
